resources:
  jobs:
    cards_setup:
      name: cards_setup
      description: One-time setup for the cards build; generates the synthetic source files (fixed seed, rewrites the raw folders)
      tasks:
        - task_key: generate
          environment_key: default
          spark_python_task:
            python_file: ../src/data/generate.py
            parameters:
              - --seed_dir
              - /Volumes/${var.catalog}/${var.schema}/${resources.volumes.seed.name}
              - --raw_dir
              - /Volumes/${var.catalog}/${var.schema}/${resources.volumes.raw.name}
              - --seed
              - "20261120"
        - task_key: access_policies
          depends_on:
            - task_key: generate
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/01_access_policies.sql
      environments:
        - environment_key: default
          spec:
            client: "2"

    cards_daily:
      name: cards_daily
      description: Daily run after the 12:01 am source file drop (schedule paused outside evidence runs)
      schedule:
        quartz_cron_expression: "0 30 0 * * ?"
        timezone_id: America/New_York
        pause_status: PAUSED
      tasks:
        - task_key: land_files
          environment_key: default
          spark_python_task:
            python_file: ../src/data/land_files.py
            parameters:
              - --seed_dir
              - /Volumes/${var.catalog}/${var.schema}/${resources.volumes.seed.name}
              - --raw_dir
              - /Volumes/${var.catalog}/${var.schema}/${resources.volumes.raw.name}
        - task_key: access_policies
          depends_on:
            - task_key: land_files
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/01_access_policies.sql
        - task_key: pipeline
          depends_on:
            - task_key: access_policies
          pipeline_task:
            pipeline_id: ${resources.pipelines.cards_pipeline.id}
        - task_key: views_and_tags
          depends_on:
            - task_key: pipeline
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/02_views_and_tags.sql
        - task_key: train_and_score
          depends_on:
            - task_key: views_and_tags
          environment_key: ml
          spark_python_task:
            python_file: ../src/ai/01_train_and_score.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --experiment
              - ${resources.experiments.cards_acceptance.name}
        - task_key: target_scores_policy
          depends_on:
            - task_key: train_and_score
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/03_target_scores_policy.sql
        - task_key: explanations
          depends_on:
            - task_key: target_scores_policy
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ai/02_explanations.sql
        - task_key: genai_judge
          depends_on:
            - task_key: explanations
          environment_key: judge
          spark_python_task:
            python_file: ../src/ai/03_genai_judge.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --experiment
              - ${resources.experiments.cards_acceptance.name}
              - --judge-endpoint
              - ${var.judge_endpoint}
      environments:
        - environment_key: default
          spec:
            client: "2"
        - environment_key: ml
          spec:
            client: "2"
            dependencies:
              - mlflow>=3.1
              - scikit-learn>=1.4
        - environment_key: judge
          spec:
            client: "2"
            dependencies:
              - mlflow[databricks]>=3.1
