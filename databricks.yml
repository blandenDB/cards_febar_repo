bundle:
  name: cards_febar

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the build
    default: c360_bank
  schema:
    description: Schema that holds every table, volume and model for the cards build
    default: cards
  warehouse_id:
    description: Serverless SQL warehouse used for queries, Genie and the app
    default: 7252b2dd64dc2427
  llm_endpoint:
    description: Foundation model endpoint for explanations
    default: databricks-claude-haiku-5-5
  judge_endpoint:
    description: Foundation model endpoint for the GenAI judge
    default: databricks-claude-sonnet-5-5

targets:
  febar:
    default: true
    workspace:
      host: https://fevm-febar-c360-bank.cloud.databricks.com
